# Textos da página em espanhol (es). O modelo é src/page.html; o build é ci/build.py.
# Mudou um texto aqui, mude nos quatro arquivos. Cada chave de pt.toml precisa existir nos outros três:
# se faltar uma, o build para e diz qual.
# Escrever o texto como ele deve aparecer: o build escapa <, > e &. A exceção são as chaves
# terminadas em _html, que levam marcação. {date} vira a data no formato de [date].

[meta]
title = "Arthur Cei Corrêa — DevOps, IA aplicada y seguridad"
description = "Portafolio de Arthur Cei Corrêa, estudiante de Ingeniería de Software en FIAP, enfocado en DevOps, IA aplicada y seguridad. Proyectos, competencias y currículum."
