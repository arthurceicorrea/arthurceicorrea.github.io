# Projetos, na ordem da página. Para acrescentar um, acrescente um bloco [[projects]] na mesma posição nos quatro
# arquivos. repo é o endereço do repositório; sem repositório público, use repo_note no lugar.
[[projects]]
title = "Vinheria Agnello: integración de infraestructura"
meta = "FIAP, 2026 (fase 7), con el equipo CodeSquad"
summary = "Integré dos microservicios .NET en Docker Compose, con red, autenticación y TLS, y configuré el pipeline de Jenkins que los entrega."
stack = "Docker Compose, .NET, dnsmasq, JWT, TLS, Jenkins, Tableau, Node-RED (MQTT)."
repo_note = "Privado, sin enlace público; código disponible para demostración en entrevista."
problem = "Lograr que dos microservicios .NET funcionen juntos, con servicios de red (DNS y DHCP), autenticación y tráfico cifrado, y automatizar la entrega."
role = "Integré y validé los dos microservicios con Docker Compose, con DNS y DHCP (dnsmasq), autenticación JWT y TLS. Configuré el pipeline de Jenkins que compila, publica y despliega los servicios, con scripts de validación automatizada y evidencias de ejecución. También contribuí con paneles en Tableau y Node-RED (MQTT)."

[[projects]]
title = "Frio Solidário, Global Solution 2026/2 (FIAP)"
meta = "Noviembre de 2026, con el equipo CodeSquad"
summary = "Me encargué de la seguridad y las pruebas de la API, que monitorea la cadena de frío de bancos de alimentos."
stack = ".NET 10, EF Core, PostgreSQL, JWT, BCrypt, xUnit."
repo = "https://github.com/CodeSquad-FIAP/Frio-Solidario-Global-Solution"
problem = "Monitorear la cadena de frío en bancos de alimentos y comercios donantes: sensores miden temperatura, humedad y apertura de puerta, la API compara cada lectura con el rango del equipo y la app avisa al voluntario antes de que se pierda el lote."
role = "Seguridad y pruebas de una API .NET: autenticación JWT, perfiles de acceso, aislamiento de datos por institución y protección contra inyección SQL y XSS; plan de pruebas con 8 casos, ejecutado con evidencias, y pruebas xUnit de las reglas de negocio, como la regla de alerta."

[[projects]]
title = "SellOut EasyTrack"
meta = "2.º puesto en el FIAP Challenge 2025 (Asteria), con el equipo CodeSquad"
summary = "Aplicación de escritorio para la gestión de ventas; desarrollé principalmente la lógica central del back-end."
stack = "Java 11, Maven, MySQL, FlatLaf, JUnit, R (análisis)."
repo = "https://github.com/arthurceicorrea/SellOutEasyTrack"
problem = "Aplicación de escritorio para la gestión de ventas, desarrollada para el FIAP Challenge 2025."
role = "Desarrollé principalmente la lógica central del back-end."

[[projects]]
title = "Este sitio"
meta = "2026, proyecto personal"
summary = "Portafolio en cuatro idiomas, que solo se publica tras superar pruebas automáticas. Concebí y dirigí el proyecto."
stack = "HTML y CSS, GitHub Pages, GitHub Actions, Python, Playwright, axe-core, Lighthouse."
repo = "https://github.com/arthurceicorrea/arthurceicorrea.github.io"
problem = "Un portafolio en cuatro idiomas, accesible y sin recursos de terceros, que solo se publica después de superar pruebas automáticas."
role = "Concebí y dirigí el proyecto: definí los requisitos, las verificaciones del pipeline y las prioridades de cada mejora. Usé IA como herramienta para escribir el código."

