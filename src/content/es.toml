footer_note = "aviso de privacidad"
intro = "Este sitio no usa cookies, no guarda nada en su navegador, no mide visitas y no carga nada de otros sitios: fuentes, estilos, scripts e imágenes vienen de él mismo. El idioma se elige en su dispositivo, por la zona horaria, sin consultar servicio alguno, y la dirección de esta página no se envía a los sitios a los que llevan los enlaces."
services = "Fuera del sitio, dos servicios reciben su visita, como ocurre con cualquier sitio publicado en ellos:"
cloudflare = "Cloudflare, que atiende el dominio {domain} y entrega las páginas, procesa su dirección IP y datos de la conexión ({policy}, en inglés);"
cloudflare_policy = "política de privacidad de Cloudflare"
