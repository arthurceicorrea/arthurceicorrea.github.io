title = "Privacy — Arthur Cei Corrêa"
heading = "Privacy"
description = "Nota sulla privacy del sito di Arthur Cei Corrêa: senza cookie, senza tracciamento e senza risorse di terze parti, e che cosa ricevono dalla visita Cloudflare e GitHub Pages."
# Letto dai lettori di schermo dopo la frase del piè di pagina, che è un link a questa pagina.
footer_note = "nota sulla privacy"
intro = "Questo sito non usa cookie, non salva nulla nel suo browser, non misura le visite e non carica nulla da altri siti: caratteri, stili, script e immagini provengono dal sito stesso. La lingua viene scelta sul suo dispositivo, in base al fuso orario, senza consultare alcun servizio, e l’indirizzo di questa pagina non viene inviato ai siti a cui portano i link."
services = "Fuori dal sito, due servizi ricevono la sua visita, come accade con qualsiasi sito pubblicato su di essi:"
cloudflare = "Cloudflare, che risponde per il dominio {domain} e consegna le pagine, tratta il suo indirizzo IP e i dati della connessione ({policy}, in inglese);"
