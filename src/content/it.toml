[[projects]]
title = "Vinheria Agnello: integrazione dell’infrastruttura"
meta = "FIAP, 2026 (fase 7), con il team CodeSquad"
summary = "Ho integrato due microservizi .NET in Docker Compose, con rete, autenticazione e TLS, e ho configurato la pipeline Jenkins che li rilascia."
stack = "Docker Compose, .NET, dnsmasq, JWT, TLS, Jenkins, Tableau, Node-RED (MQTT)."
repo_note = "Privato, senza link pubblico; codice disponibile per una demo al colloquio."
problem = "Far funzionare insieme due microservizi .NET, con i servizi di rete (DNS e DHCP), l’autenticazione e il traffico cifrato. Automatizzare il rilascio."
role = "Ho integrato e validato i due microservizi con Docker Compose, con DNS e DHCP (dnsmasq), autenticazione JWT e TLS. Ho configurato la pipeline Jenkins che compila, pubblica e rilascia i servizi, con script di validazione automatica ed evidenze di esecuzione. Ho contribuito anche con dashboard in Tableau e Node-RED (MQTT)."

[[projects]]
title = "Frio Solidário, Global Solution 2026/2 (FIAP)"
meta = "Novembre 2026, con il team CodeSquad"
summary = "Mi sono occupato della sicurezza e dei test dell’API, che monitora la catena del freddo dei banchi alimentari."
stack = ".NET 10, EF Core, PostgreSQL, JWT, BCrypt, xUnit."
repo = "https://github.com/CodeSquad-FIAP/Frio-Solidario-Global-Solution"
problem = "Monitorare la catena del freddo nei banchi alimentari e nei negozi donatori: i sensori misurano temperatura, umidità e apertura della porta, l’API confronta ogni lettura con l’intervallo dell’apparecchio e l’app avvisa il volontario prima che il lotto vada perso."
role = "Sicurezza e test di un’API .NET: autenticazione JWT, ruoli di accesso, isolamento dei dati per istituzione, protezione da SQL injection e XSS. Un piano di test con 8 casi, eseguito con evidenze. Test xUnit delle regole di business, come la regola di allerta."

[[projects]]
title = "SellOut EasyTrack"
meta = "Secondo posto nel concorso FIAP Challenge 2025 (Asteria), con il team CodeSquad"
summary = "Un’applicazione desktop per la gestione delle vendite; ho sviluppato soprattutto la logica centrale del back-end."
stack = "Java 11, Maven, MySQL, FlatLaf, JUnit, R (analisi)."
repo = "https://github.com/arthurceicorrea/SellOutEasyTrack"
problem = "Un’applicazione desktop per la gestione delle vendite, sviluppata per il concorso FIAP Challenge 2025."
role = "Ho sviluppato soprattutto la logica centrale del back-end."

