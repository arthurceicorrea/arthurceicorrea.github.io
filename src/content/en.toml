[[projects]]
title = "Vinheria Agnello: infrastructure integration"
meta = "FIAP, 2026 (phase 7), with team CodeSquad"
summary = "I integrated two .NET microservices in Docker Compose, with networking, authentication and TLS, and set up the Jenkins pipeline that delivers them."
stack = "Docker Compose, .NET, dnsmasq, JWT, TLS, Jenkins, Tableau, Node-RED (MQTT)."
repo_note = "Private, no public link; code available for demonstration in an interview."
problem = "Getting two .NET microservices to work together, with network services (DNS and DHCP), authentication and encrypted traffic, and automating delivery."
role = "I integrated and validated the two microservices with Docker Compose, with DNS and DHCP (dnsmasq), JWT authentication and TLS. I configured the Jenkins pipeline that builds, publishes and deploys the services, with automated validation scripts and execution evidence. I also contributed Tableau and Node-RED (MQTT) dashboards."

[[projects]]
title = "Frio Solidário, Global Solution 2026/2 (FIAP)"
meta = "November 2026, with the CodeSquad team"
summary = "I handled security and testing for the API, which monitors the cold chain of food banks."
stack = ".NET 10, EF Core, PostgreSQL, JWT, BCrypt, xUnit."
repo = "https://github.com/CodeSquad-FIAP/Frio-Solidario-Global-Solution"
problem = "Monitor the cold chain in food banks and donor shops: sensors measure temperature, humidity and door opening, the API checks each reading against the equipment’s range, and the app warns the volunteer before a batch is lost."
role = "Security and testing of a .NET API: JWT authentication, role-based access, per-institution data isolation, and protection against SQL injection and XSS; an 8-case test plan executed with evidence, and xUnit tests of the business rules, such as the alert rule."

[[projects]]
title = "SellOut EasyTrack"
meta = "2nd place in the FIAP Challenge 2025 (Asteria), with team CodeSquad"
summary = "A desktop sales management application; I mainly developed the core back-end logic."
stack = "Java 11, Maven, MySQL, FlatLaf, JUnit, R (analysis)."
repo = "https://github.com/arthurceicorrea/SellOutEasyTrack"
problem = "A desktop application for sales management, built for the FIAP Challenge 2025."
role = "I mainly developed the core back-end logic."

