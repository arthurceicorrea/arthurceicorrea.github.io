# Projetos, na ordem da página. Para acrescentar um, acrescente um bloco [[projects]] na mesma posição nos quatro
# arquivos. repo é o endereço do repositório; sem repositório público, use repo_note no lugar.
[[projects]]
title = "Vinheria Agnello: integração de infraestrutura"
meta = "FIAP, 2026 (fase 7), com a equipe CodeSquad"
summary = "Integrei dois microsserviços .NET em Docker Compose, com rede, autenticação e TLS, e configurei o pipeline Jenkins que os entrega."
stack = "Docker Compose, .NET, dnsmasq, JWT, TLS, Jenkins, Tableau, Node-RED (MQTT)."
repo_note = "Privado, sem link público; código disponível para demonstração em entrevista."
problem = "Fazer dois microsserviços .NET funcionarem juntos, com serviços de rede (DNS e DHCP), autenticação e tráfego cifrado, e automatizar a entrega."
role = "Integrei e validei os dois microsserviços em Docker Compose, com DNS e DHCP (dnsmasq), autenticação JWT e TLS. Configurei o pipeline Jenkins que compila, publica e implanta os serviços, com scripts de validação automatizada e evidências de execução. Contribuí também com painéis em Tableau e Node-RED (MQTT)."

[[projects]]
title = "Frio Solidário, Global Solution 2026/2 (FIAP)"
meta = "Novembro de 2026, com a equipe CodeSquad"
summary = "Cuidei da segurança e dos testes da API, que monitora a cadeia de frio de bancos de alimentos."
stack = ".NET 10, EF Core, PostgreSQL, JWT, BCrypt, xUnit."
repo = "https://github.com/CodeSquad-FIAP/Frio-Solidario-Global-Solution"
problem = "Monitorar a cadeia de frio em bancos de alimentos e comércios doadores: sensores medem temperatura, umidade e abertura de porta, a API compara cada leitura com a faixa do equipamento e o app avisa o voluntário antes que o lote se perca."
role = "Segurança e testes de uma API .NET: autenticação JWT, perfis de acesso, isolamento de dados por instituição e proteção contra SQL injection e XSS; plano de testes com 8 casos, executado com evidências, e testes xUnit das regras de negócio, como a regra de alerta."

[[projects]]
title = "SellOut EasyTrack"
meta = "2º lugar no FIAP Challenge 2025 (Asteria), com a equipe CodeSquad"
summary = "Aplicação desktop de gestão de vendas, em que desenvolvi principalmente a lógica central do back-end."
stack = "Java 11, Maven, MySQL, FlatLaf, JUnit, R (análise)."
repo = "https://github.com/arthurceicorrea/SellOutEasyTrack"
problem = "Aplicação desktop de gestão de vendas, desenvolvida para o FIAP Challenge 2025."
role = "Desenvolvi principalmente a lógica central do back-end."

[[projects]]
title = "Este site"
meta = "2026, projeto pessoal"
summary = "Portfólio em quatro idiomas, publicado só depois de passar por testes automáticos. Concebi e conduzi o projeto."
stack = "HTML e CSS, GitHub Pages, GitHub Actions, Python, Playwright, axe-core, Lighthouse."
repo = "https://github.com/arthurceicorrea/arthurceicorrea.github.io"
problem = "Um portfólio em quatro idiomas, acessível e sem recursos de terceiros, que só é publicado depois de passar por testes automáticos."
role = "Concebi e conduzi o projeto: defini os requisitos, as verificações do pipeline e as prioridades de cada melhoria. Usei IA como ferramenta para escrever o código."

