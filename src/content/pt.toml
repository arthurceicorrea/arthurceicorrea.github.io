# Textos da página em português (pt-BR). O modelo é src/page.html; o build é ci/build.py.
# Mudou um texto aqui, mude nos quatro arquivos. Cada chave de pt.toml precisa existir nos outros três:
# se faltar uma, o build para e diz qual.
# Escrever o texto como ele deve aparecer: o build escapa <, > e &. A exceção são as chaves
# terminadas em _html, que levam marcação. {date} vira a data no formato de [date].

