name: Site

# Valida a página a cada alteração e, se tudo passar, publica no GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar as ferramentas de teste
        run: pip install "pypdf>=6,<7" "playwright>=1.48,<2"

      - name: Montar o site (página inicial e uma página por idioma)
        run: python ci/build.py

      - name: Validação estática (CSP, HTML, links, idiomas, dados estruturados, privacidade)
        run: python ci/validate.py _site

      - name: Teste no navegador (idiomas, países, celular e tela larga, sem JavaScript)
        run: python ci/smoke.py _site

      - name: Enviar o pacote do site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
